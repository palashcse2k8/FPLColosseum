
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.infotech.fplcolosseum'
    compileSdk 36

    defaultConfig {
        applicationId "com.infotech.fplcolosseum"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig = true
    }

    lint {
        baseline = file("lint-baseline.xml")
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    implementation "com.squareup.okhttp3:okhttp-urlconnection:4.4.1"
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'  // Use the latest version

    implementation 'org.jsoup:jsoup:1.14.3'

    //room database
    implementation "androidx.room:room-runtime:2.8.0"
    annotationProcessor "androidx.room:room-compiler:2.8.0"

    //resolve bloody 1000 class duplicates error, thanks good for this heck!
    implementation (platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
    // ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.9.4"
//    def lifecycle_version = "2.8.4"
//    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.orhanobut:logger:2.2.0'
    implementation 'com.squareup.picasso:picasso:2.8'

    //to use toasty
    implementation 'com.github.GrenderG:Toasty:1.5.2'

    //android utility
    implementation 'com.blankj:utilcodex:1.31.1'

    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0-beta01"

    //for automatic time zone mapping in android
    implementation 'com.ibm.icu:icu4j:72.1'

    //for android graph
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}